<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bili-video 工作台原型</title>
<!-- 图标：Phosphor 官方 web 包（CDN）。生产环境改用 @phosphor-icons/react，不手写 SVG path。 -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<!--
  PROTOTYPE - 丢弃代码，不进 main。

  问题:「工作台长什么样」。三个变体是三种信息层级，不是三种配色。
    A 时间线  - 单列信息流，没有侧栏，读「今天更新了什么」
    B 分栏阅读 - 左索引右长文，读「这条视频到底讲了什么」
    C 运行台  - 密度最高，看「管道是不是健康的」
  ?variant=A|B|C 切换，?theme=light|dark 锁定主题，底部悬浮条 + 左右方向键。

  设计约束（本次重做的原因）:
    · 单一强调色 = B 站品牌粉 #FB7299，只用在主操作 / 当前选中 / 实时状态三处，
      其余全部交给中性灰阶 + 语义状态色（成功 / 警告 / 失败 / 停用）。
      上一版每个变体一套配色、六种糖果色铺满卡片，是它丑的主要原因。
    · 一套圆角：面板 14px，控件与缩略图 10px，chip 7px，头像与实时指示器圆形。
    · 一套主题：整页同时给出亮色与暗色 token，跟随系统，不做分区反色。
    · 视频封面用真实图片（picsum 占位），不用渐变色块假装缩略图。
    · 图标来自 Phosphor，不用 emoji。

  全部数据是假的，写死在内存里：无后端、无持久化、无错误处理。这个文件永远不进生产。
-->
<style>
/* ================= token ================= */
:root{
  color-scheme:light dark;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --accent:#FB7299; --on-accent:#fff;
  --ok:#1F8A5B; --warn:#A9741C; --bad:#C1483C; --idle:#7A8592;
  --bg:#F2F5F7; --surface:#fff; --surface2:#F7F9FB; --raise:#fff;
  --line:#E1E7EC; --line2:#EDF1F5;
  --ink:#14171C; --ink2:#39424C; --dim:#69737F;
  --shadow:0 1px 2px #14171c0d,0 10px 28px #14171c0f;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
:root[data-theme=dark]{
  --accent:#FF89A9; --on-accent:#20101A;
  --ok:#3CB781; --warn:#D2A244; --bad:#E1685A; --idle:#7C8794;
  --bg:#0C0F13; --surface:#13171D; --surface2:#181D24; --raise:#1B212A;
  --line:#242B34; --line2:#1D232B;
  --ink:#E8EDF3; --ink2:#B7C0CB; --dim:#7F8A97;
  --shadow:0 1px 2px #00000055,0 12px 32px #00000066;
}
/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
img{display:block;max-width:100%}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:var(--dim)}
.i{font-size:1.05em;line-height:0;vertical-align:-.12em}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::selection{background:var(--accent);color:var(--on-accent)}

/* ================= 共用构件 ================= */
.av{border-radius:999px;flex:0 0 auto;display:grid;place-items:center;font-weight:650;
  background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--ink);
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.thumb{border-radius:var(--r-md);flex:0 0 auto;overflow:hidden;position:relative;background:var(--surface2);
  border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .dur{position:absolute;right:5px;bottom:5px;background:#0b0e12cc;color:#fff;
  font:600 11px/1 var(--mono);padding:3px 5px;border-radius:5px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:600;padding:3px 8px;white-space:nowrap;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.chip.s-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.chip.s-run{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 34%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip.s-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.s-skip{color:var(--idle);border-style:dashed}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.live b{width:8px;height:8px;border-radius:999px;background:var(--ok);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.live b{animation:beat 2.4s ease-in-out infinite}}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot 1.6s linear infinite;display:inline-block}}
@keyframes rot{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--on-accent);
  border:0;border-radius:var(--r-md);padding:9px 15px;font-weight:650;font-size:13.5px;cursor:pointer;
  transition:filter .15s,transform .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:12.5px;color:var(--dim)}
.meta>span:not(:first-child){border-left:1px solid var(--line);padding-left:9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.ph h2{font-size:13.5px;font-weight:700;letter-spacing:.2px}
.ph .cnt{font:600 11.5px/1 var(--mono);color:var(--dim)}
.ph .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
.tt{font-weight:640;letter-spacing:-.1px}
.sw{width:36px;height:20px;border-radius:999px;background:var(--line);border:0;padding:0;position:relative;
  cursor:pointer;flex:0 0 auto;transition:background .16s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;
  background:var(--surface);box-shadow:0 1px 3px #0003;transition:left .16s}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{left:18px}

/* ================= 原型脚手架（刻意做成外来物，不参与设计评审） ================= */
#sw{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;
  gap:2px;padding:5px;border-radius:999px;background:#0B0E12f2;border:1.5px dashed #FB7299;
  box-shadow:0 10px 34px #0006;font:12px/1 var(--mono);color:#fff;backdrop-filter:blur(8px)}
#sw button{all:unset;cursor:pointer;padding:8px 11px;border-radius:999px;font:inherit;color:#fff}
#sw button:hover{background:#ffffff1f}
#sw #key{background:#FB7299;color:#20101A;font-weight:700;padding:6px 9px;border-radius:999px}
#sw #lab{padding:0 9px;white-space:nowrap}
#sw #lab b{color:#FFD166;font-weight:600}
#sw .sep{width:1px;height:16px;background:#ffffff2e;margin:0 3px}
#state{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:9998;width:min(720px,94vw);
  padding:13px 15px;border-radius:var(--r-lg);background:#0B0E12f7;border:1px solid #ffffff24;color:#E6EAF0;
  font:12px/1.75 var(--mono);box-shadow:0 14px 40px #0007}
#state[hidden]{display:none}
#state h4{color:#FB7299;font-size:11.5px;letter-spacing:1.2px;margin-bottom:5px}
#state s{color:#79879A;text-decoration:none;display:inline-block;width:84px}

/* ================= 变体 A · 时间线 ================= */
.v-a{max-width:1000px;margin:0 auto;padding:0 24px 110px}
.v-a .rail{display:flex;align-items:center;gap:14px;padding:18px 0 16px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--bg) 72%,transparent)}
.v-a .lg{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15.5px;letter-spacing:-.2px}
.v-a .lg i{color:var(--accent);font-size:20px}
.v-a .tabs{display:flex;gap:2px;margin-left:10px}
.v-a .tabs a{padding:7px 12px;border-radius:var(--r-md);font-size:13.5px;color:var(--dim);font-weight:550}
.v-a .tabs a:hover{background:var(--surface);color:var(--ink)}
.v-a .tabs a[aria-current]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.v-a .rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.v-a .head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:14px 0 22px}
.v-a .head h1{font-size:15px;font-weight:600;color:var(--dim);letter-spacing:.2px;margin-bottom:6px}
.v-a .head .big{display:flex;align-items:baseline;gap:12px}
.v-a .head .big b{font:750 46px/1 var(--mono);letter-spacing:-2.5px}
.v-a .head .big span{font-size:14.5px;color:var(--ink2);padding-bottom:4px}
.v-a .stats{display:flex;gap:0;text-align:right}
.v-a .stats div{padding:0 16px;border-right:1px solid var(--line)}
.v-a .stats div:last-child{padding-right:0;border-right:0}
.v-a .stats label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.v-a .stats b{font:700 17px/1.2 var(--mono)}
.v-a .strip{display:flex;align-items:center;gap:8px;overflow:auto;padding-bottom:22px}
.v-a .strip .u{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;white-space:nowrap;flex:0 0 auto}
.v-a .strip .u .av{width:26px;height:26px;font-size:12px}
.v-a .strip .u.off{opacity:.48}
.v-a .strip .u.off span{text-decoration:line-through}
.v-a .day{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:650;color:var(--dim);
  letter-spacing:.4px;margin-bottom:12px}
.v-a .day::after{content:"";flex:1;height:1px;background:var(--line)}
.v-a .feed{display:flex;flex-direction:column;gap:12px}
.v-a .it{display:grid;grid-template-columns:184px 1fr;gap:16px;padding:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:border-color .15s}
.v-a .it:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.v-a .it.post{grid-template-columns:44px 1fr}
.v-a .it.post .ic{width:44px;height:44px;border-radius:var(--r-md);background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);font-size:20px}
.v-a .it .thumb{width:184px;aspect-ratio:16/9}
.v-a .it h3{font-size:16.5px;line-height:1.45;font-weight:650;letter-spacing:-.2px;margin-bottom:7px}
.v-a .it .who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);margin-bottom:9px}
.v-a .it .who .av{width:20px;height:20px;font-size:10.5px}
.v-a .it .sum{background:var(--surface2);border:1px solid var(--line2);border-left:2px solid var(--accent);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 13px;font-size:14px;line-height:1.68;color:var(--ink2);
  margin-bottom:10px}
.v-a .it .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.v-a .it .row .push{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
.v-a .it.mute{opacity:.62;grid-template-columns:44px 1fr;padding:12px 14px}
.v-a .it.mute h3{font-size:14.5px;font-weight:550;text-decoration:line-through;color:var(--dim);margin-bottom:5px}
@media (max-width:720px){
  .v-a{padding:0 14px 110px}
  .v-a .it,.v-a .it.post,.v-a .it.mute{grid-template-columns:1fr}
  .v-a .it .thumb{width:100%}
  .v-a .head{grid-template-columns:1fr}
  .v-a .stats{justify-content:flex-start;text-align:left}
  .v-a .stats div:first-child{padding-left:0}
  .v-a .tabs{display:none}
}
/* ================= 变体 B · 分栏阅读 ================= */
.v-b{height:100dvh;display:grid;grid-template-rows:auto 1fr}
.v-b .bar{display:flex;align-items:center;gap:14px;padding:0 18px;height:60px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.v-b .lg{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15.5px;letter-spacing:-.2px}
.v-b .lg i{color:var(--accent);font-size:20px}
.v-b .tabs{display:flex;gap:1px;margin-left:12px}
.v-b .tabs a{padding:7px 12px;border-radius:var(--r-md);font-size:13.5px;color:var(--dim);font-weight:550}
.v-b .tabs a:hover{background:var(--surface2);color:var(--ink)}
.v-b .tabs a[aria-current]{color:var(--ink);background:var(--surface2)}
.v-b .bar .rt{margin-left:auto;display:flex;align-items:center;gap:14px}
.v-b .split{display:grid;grid-template-columns:364px 1fr;min-height:0}
.v-b .idx{border-right:1px solid var(--line);overflow:auto;background:var(--surface)}
.v-b .ih{display:flex;align-items:center;gap:9px;padding:12px 16px;position:sticky;top:0;background:var(--surface);
  border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--dim);z-index:2}
.v-b .ih .cnt{margin-left:auto;font:600 11.5px/1 var(--mono)}
.v-b .li{display:grid;grid-template-columns:96px 1fr;gap:11px;padding:12px 16px;cursor:pointer;
  border-bottom:1px solid var(--line2);border-left:2px solid transparent}
.v-b .li:hover{background:var(--surface2)}
.v-b .li[aria-selected=true]{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.v-b .li .thumb{width:96px;aspect-ratio:16/9}
.v-b .li .ic{width:96px;aspect-ratio:16/9;border-radius:var(--r-md);background:var(--surface2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:19px}
.v-b .li h3{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-b .li .sub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.v-b .li.mute h3{color:var(--dim);text-decoration:line-through;font-weight:500}
.v-b .doc{overflow:auto;padding:0 0 110px}
.v-b .inner{max-width:720px;margin:0 auto;padding:30px 28px 0}
.v-b .cover{aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);
  margin-bottom:20px;background:var(--surface2)}
.v-b .cover img{width:100%;height:100%;object-fit:cover}
.v-b .doc h1{font-size:27px;line-height:1.35;font-weight:730;letter-spacing:-.6px;margin-bottom:11px}
.v-b .byline{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.v-b .byline .av{width:32px;height:32px;font-size:13px}
.v-b .byline b{font-size:13.5px;font-weight:620;display:block}
.v-b .byline small{font-size:12px;color:var(--dim)}
.v-b .byline .rt{margin-left:auto;display:flex;gap:7px}
.v-b .lead{font-size:18.5px;line-height:1.7;font-weight:520;color:var(--ink);padding:18px 20px;
  background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));
  border-radius:var(--r-lg);margin-bottom:26px}
.v-b .sec{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin-bottom:12px}
.v-b .pts{margin-bottom:28px}
.v-b .pt{display:grid;grid-template-columns:26px 1fr;gap:13px;padding:13px 0;border-top:1px solid var(--line2);
  font-size:14.5px;line-height:1.72;color:var(--ink2)}
.v-b .pt:last-child{border-bottom:1px solid var(--line2)}
.v-b .pt em{font:700 13px/1.5 var(--mono);color:var(--accent);font-style:normal}
.v-b .chs{display:grid;gap:2px;margin-bottom:28px}
.v-b .ch{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:11px 12px;
  border-radius:var(--r-md);cursor:pointer;background:var(--surface)}
.v-b .ch:hover{background:var(--surface2)}
.v-b .ch time{font:650 12.5px/1 var(--mono);color:var(--accent)}
.v-b .ch b{font-size:14px;font-weight:600;display:block}
.v-b .ch small{font-size:12.5px;color:var(--dim)}
.v-b .ch i{color:var(--dim);font-size:15px;opacity:0}
.v-b .ch:hover i{opacity:1}
.v-b .foot{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.v-b .foot div{background:var(--surface);padding:13px 15px}
.v-b .foot label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.v-b .foot b{font:650 13.5px/1.4 var(--mono)}
.v-b .empty{max-width:520px;margin:0 auto;padding:90px 24px;text-align:center;color:var(--dim)}
.v-b .empty i{font-size:38px;color:var(--idle)}
.v-b .empty h2{font-size:17px;font-weight:650;color:var(--ink);margin:14px 0 7px}
@media (max-width:900px){
  .v-b{height:auto}
  .v-b .split{grid-template-columns:1fr}
  .v-b .idx{border-right:0;border-bottom:1px solid var(--line)}
  .v-b .foot{grid-template-columns:repeat(2,1fr)}
  .v-b .inner{padding:20px 14px 0}
  .v-b .tabs{display:none}
}

/* ================= 变体 C · 运行台 ================= */
.v-c{max-width:1280px;margin:0 auto;padding:0 20px 110px}
.v-c .bar{display:flex;align-items:center;gap:13px;height:58px}
.v-c .lg{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;letter-spacing:-.2px}
.v-c .lg i{color:var(--accent);font-size:19px}
.v-c .tabs{display:flex;gap:1px;margin-left:10px}
.v-c .tabs a{padding:6px 11px;border-radius:var(--r-sm);font-size:13px;color:var(--dim);font-weight:550}
.v-c .tabs a:hover{color:var(--ink);background:var(--surface)}
.v-c .tabs a[aria-current]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.v-c .bar .rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.v-c .band{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:center;padding:20px 22px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  margin-bottom:14px}
.v-c .band label{display:block;font-size:12px;color:var(--dim);margin-bottom:7px}
.v-c .band .clk{display:flex;align-items:baseline;gap:13px;margin-bottom:11px}
.v-c .band .clk b{font:750 44px/1 var(--mono);letter-spacing:-2.5px}
.v-c .band .clk span{font-size:13.5px;color:var(--ink2)}
.v-c .band .cron{font:12.5px/1 var(--mono);color:var(--dim)}
.v-c .band .acts{display:flex;gap:8px;margin-top:14px}
.v-c .spark{display:flex;align-items:flex-end;gap:4px;height:74px}
.v-c .spark i{flex:1;background:color-mix(in srgb,var(--accent) 22%,var(--surface2));border-radius:3px 3px 0 0;
  min-height:3px;position:relative}

          `<i style="height:${Math.round(v/max*100)}%" ${i>=SPARK.length-2?'data-hot':''} title="${v} 条"></i>`).join('')}</div>
        <div class="sparkx"><span>08-25</span><span>09-07</span></div>
      </div>
    </div>

    <div class="mx">
      <div><label>${ic('users-three')}监听中</label><b class="n">4</b><small>另有 1 个已屏蔽</small></div>
      <div><label>${ic('sparkle')}今日总结</label><b class="n">4</b><small>1 条降级到 ASR</small></div>
      <div><label>${ic('paper-plane-tilt')}推送成功率</label><b class="n">100%</b><small>近 30 天 0 次失败</small></div>
      <div><label>${ic('coins')}本月 tokens</label><b class="n">218.4k</b><small>预算 500k，单条均值 7.8k</small></div>
    </div>

    <div class="cols">
      <div class="panel">
        <div class="ph">${ic('flow-arrow')}<h2>处理管道</h2>
          <div class="rt"><span class="chip s-ok">${ic('sparkle')}AI 总开关 开</span></div></div>
        <div class="pipe">${STEPS.map(([icon,name,desc,v,unit],i)=>
          `<div class="stp ${i===4?'hot':''}">
            <span class="b">${ic(icon)}</span>
            <span><b>${esc(name)}</b><small>${esc(desc)}</small></span>
            <span class="v">${v}<em> ${unit}</em></span>
          </div>${i<STEPS.length-1?'<div class="lk"></div>':''}`).join('')}</div>
      </div>

      <div class="panel">
        <div class="ph">${ic('users-three')}<h2>UP 主</h2><span class="cnt">4 / 5 开启</span>
          <div class="rt"><button class="btn ghost">${ic('plus')}添加</button></div></div>
        <table>
          <thead><tr><th>UP 主</th><th>最新一条</th><th>近 30 天</th><th>监听</th></tr></thead>
          <tbody>${UPS.map((u,i)=>{
            const last = FEED.find(x => x.up === i);
            return `<tr class="${u.on?'':'off'}">
            <td><span class="u">${av(i)}<span><b class="tt">${esc(u.n)}</b>
              <small class="dim" style="display:block;font-size:11.5px">
                ${u.ai?'AI 总结开':'仅推送'}<span class="n">　uid ${u.uid}</span></small></span></span></td>
            <td><span class="lt">
              ${last && last.cover
                ? `<span class="thumb"><img alt="" src="${pic(last.cover, 136, 77)}"></span>`
                : `<span class="ic">${ic('chat-circle-text')}</span>`}
              <span style="min-width:0"><b>${last?esc(last.title):'暂无记录'}</b>
                <small class="n">${u.last}</small></span></span></td>
            <td class="n">${u.hit}</td>
            <td><button class="sw" role="switch" aria-checked="${u.on}" aria-label="监听 ${esc(u.n)}"></button></td>
          </tr>`}).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="ph">${ic('clock-counter-clockwise')}<h2>运行日志</h2><span class="cnt">实时</span>
        <div class="rt"><button class="btn ghost">${ic('download-simple')}导出</button></div></div>
      <div class="log">${LOG.map(([t,k,m,s])=>`<div class="lr">
        <span class="t">${t}</span>
        <span class="k" style="color:${s==='dim'?'var(--dim)':`var(--${s==='skip'?'idle':s})`}">${esc(k)}</span>
        <span style="color:var(--ink2)">${esc(m)}</span></div>`).join('')}</div>
    </div>
  </div>`;
}
/* ============ 变体切换（原型脚手架，不参与设计评审） ============ */
const VARIANTS = [
  { k:'A', name:'时间线',   render:renderA, note:'单列信息流，没有侧栏。一条更新就是一张卡，总结直接摊在卡里，主场景是「今天更新了什么」。' },
  { k:'B', name:'分栏阅读', render:renderB, note:'左索引右长文。总结按文章排版，配封面、要点编号和分段导读，主场景是「这条视频到底讲了什么」。' },
  { k:'C', name:'运行台',   render:renderC, note:'密度最高。倒计时、管道各级计数、UP 主开关、日志同屏，主场景是「管道是不是健康的」。' },
];

const qs = () => new URLSearchParams(location.search);

function currentIdx(){
  const q = qs().get('variant');
  const i = VARIANTS.findIndex(v => v.k.toLowerCase() === String(q||'').toLowerCase());
  return i < 0 ? 0 : i;
}

function setQuery(patch){
  const p = qs();
  Object.entries(patch).forEach(([k,v]) => v == null ? p.delete(k) : p.set(k, v));
  try { history.replaceState(null, '', location.pathname + '?' + p + location.hash); }
  catch (e) { location.search = '?' + p; return false; }   // file:// 下 replaceState 可能被拒
  return true;
}

function applyTheme(){
  const q = qs().get('theme');
  const dark = q ? q === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

function go(i){
  const v = VARIANTS[(i + VARIANTS.length) % VARIANTS.length];
  if (setQuery({ variant: v.k })) paint();
}

function paint(){
  const idx = currentIdx(), v = VARIANTS[idx];
  applyTheme();
  document.getElementById('root').innerHTML = v.render();
  document.getElementById('key').textContent = v.k;
  document.getElementById('lab').innerHTML = `<b>${v.name}</b> ${idx+1}/${VARIANTS.length}`;
  fillState(v);
  wire();
}

/* 切换变体时把共享状态摊出来，避免「换个变体状态就没了」 */
function fillState(v){
  const f = FEED[sel];
  document.getElementById('state').innerHTML =
    `<h4>变体 ${v.k}　${v.name}</h4>
     <div><s>这一版</s>${v.note}</div>
     <div><s>选中条目</s>#${sel}　${esc(UPS[f.up].n)}《${esc(f.title)}》${f.st}</div>
     <div><s>共享状态</s>5 个 UP 主（4 开 1 屏蔽），7 条动态，AI 总开关 开，218.4k tokens</div>
     <div><s>主题</s>${document.documentElement.dataset.theme}（跟随系统，T 键锁定切换）</div>
     <div><s>键盘</s>← → 换变体，T 换主题，S 收起本说明</div>`;
}
function wire(){
  document.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('click', () => { sel = Number(el.dataset.i); paint(); });
  });
  document.querySelectorAll('.sw[role=switch]').forEach(el => {
    el.addEventListener('click', () => {
      el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true');
    });
  });
}

function toggleTheme(){
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  if (setQuery({ theme: next })) paint();
}

document.getElementById('prev').onclick  = () => go(currentIdx() - 1);
document.getElementById('next').onclick  = () => go(currentIdx() + 1);
document.getElementById('theme').onclick = toggleTheme;
document.getElementById('info').onclick  = () => {
  const s = document.getElementById('state'); s.hidden = !s.hidden;
};

addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(currentIdx() - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(currentIdx() + 1); }
  if (e.key === 't' || e.key === 'T') toggleTheme();
  if (e.key === 's' || e.key === 'S') {
    const s = document.getElementById('state'); s.hidden = !s.hidden;
  }
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!qs().get('theme')) paint();
});

paint();
</script>
</body>
