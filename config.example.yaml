# 首次启动的配置种子。之后以数据库 app_config 表为唯一真相，修改本文件无效。
# 请在工作台修改配置；重新 seed 须清空 app_config 表（见 README）。
# 缺失字段由 schema 默认值补齐，故只需填写要覆盖的字段。

server:
  # 只听回环地址。改成 0.0.0.0 等于放弃「无登录系统」这个前提，别改。
  host: 127.0.0.1
  port: 8788

poll:
  enabled: true
  # 秒位错到 :30，避开全网客户端堆在整分的流量尖峰。
  cron: '30 */2 * * * *'

bili:
  # 提前续 cookie 的天数。SESSDATA 月级有效，15 天覆盖重试和休假余量。
  refreshThresholdDays: 15
  # WBI 签名的 64 位混淆表，B 站 web 端 JS 里的公开常量。
  # 留空 = 需要签名的接口直接报错，而不是发一个签错的请求换回 -352（那会被当成风控退避）。
  # 来源：bilibili-notify packages/api/src/wbi.ts，2026-09-08 核对。
  # 签名请求开始持续吃 -352 时，先回来核对这张表有没有随前端发版变过。
  wbiMixinTable:
    [46, 47, 18, 2, 53, 8, 23, 32, 15, 50, 10, 31, 58, 3, 45, 35, 27, 43, 5, 49,
     33, 9, 42, 19, 29, 28, 14, 39, 12, 38, 41, 13, 37, 48, 7, 16, 24, 55, 40, 61,
     26, 17, 0, 1, 60, 51, 30, 4, 22, 25, 54, 21, 56, 59, 6, 63, 57, 62, 11, 36,
     20, 34, 44, 52]
  # bili_ticket 的签名参数，同样是 web 端 JS 里的公开常量，同一处来源。
  # 留空 = 风控重试链里「重取 ticket」那一步跳过并说明原因，其余流程照走。
  ticket:
    keyId: 'ec02'
    hmacKey: 'XgwSnGZ1p'
  # cookie 续期链里 correspond/1 用的 RSA 公钥（PEM，含 BEGIN/END 行）。
  # 留空 = 不做自动续期，cookie 到期只能重新扫码。
  correspondPublicKeyPem: ''
  # 自动关注这一唯一写接口的独立限流，与读接口轮询无关。
  # 写接口风控更严，3–5 个订阅即可完成，故限额保守。
  # 额度按审计表 bili_write_calls 计数，重启不会重置。
  write:
    # 总开关。设为 false 后不发送写请求；订阅仍可添加，但需手动在 B 站关注。
    # relation/modify 开始返回 -352 时，先关闭此项再排查。
    autoFollow: true
    minIntervalMs: 3000
    maxPerHour: 20

filter:
  quietHours:
    enabled: false
    start: '23:30'
    end: '07:30'
  # 手写正则的执行超时，防 ReDoS 把轮询卡死。
  regexTimeoutMs: 100

ai:
  # 关掉后只推送不总结，AI 成本归零。
  enabled: true
  # OpenAI 兼容即可。apiKey 不在这里 —— 它加密存 secrets 表，在 AI 配置页填。
  baseURL: ''
  model: ''
  temperature: 0.3
  chunk:
    # 全文超过这个 token 数才分段总结，否则整篇一次过。
    thresholdTokens: 12000
    sizeTokens: 8000
    overlapTokens: 400
  llmConcurrency: 2

asr:
  # Docker 内拿不到 Metal；启动时会自动切换到 openai-compat，页面只显示两个远程 provider。
  provider: mlx-audio
  model: mlx-community/Qwen3-ASR-0.6B-4bit
  language: Chinese
  # 关闭后不请求官方字幕，所有视频直接下载音频并运行 ASR。
  useOfficialSubtitles: true
  concurrency: 1

output:
  # 总结 Markdown 往哪儿写。相对路径按 DATA_DIR 解析，重跑同一个视频覆盖同一个文件。
  markdownDir: summaries

notify:
  # appToken 由推送目标页加密保存。
  wxpusher:
    enabled: false
    uids: []
  ntfy:
    enabled: false
    server: https://ntfy.sh
    topic: ''
    # 私有 ntfy 的 Authorization（Bearer/Basic）由推送目标页加密保存。
  feishu:
    enabled: false
    appId: ''
    receiveIdType: open_id
    receiveId: ''
    # appSecret 由推送目标页加密保存。
  webhook:
    enabled: false
    url: ''
    # Authorization 由推送目标页加密保存。

catchup:
  # 睡眠/停机唤醒后补推的时间窗，更老的只入库不推。
  windowHours: 24
  # 窗口内积压超过这个条数就只发一条汇总，不逐条轰炸。
  overflowThreshold: 20

health:
  enabled: true
  cron: '0 */30 * * * *'

log:
  level: info
  retentionDays: 7
